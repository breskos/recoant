name: Feature request
description: Propose a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        recoant is a recommendation framework for streams of user signals in Go. Please check the [roadmap](https://github.com/breskos/recoant/blob/main/ROADMAP.md) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could recoant solve it? An API sketch helps.
