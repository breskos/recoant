name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out $(go list ./... | grep -v /examples/)
      - name: Check coverage
        run: |
          if [ "$(wc -l < coverage.out)" -le 1 ]; then
            echo "No statements to cover yet."
            exit 0
          fi
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "### Test coverage (Go ${{ matrix.go }}): ${total}%" >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v min=90 'BEGIN { exit !(t < min) }'; then
            echo "::error::Test coverage ${total}% is below 90%"
            exit 1
          fi
      - name: Use cases run
        run: go test ./examples/usecases/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
